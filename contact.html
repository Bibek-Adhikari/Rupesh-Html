        <h3> Contact Me </h3>
        <form>
            <fieldset>
            <legend> Enter your details: </legend>
            <label> Full Name </label>
            <input type="text" name="Full name" placeholder="Enter full name"><br>
            <label> Phone Number</label>
            <input type="number" name="Phone" max="10" min="0"><br>
            <label> Gender </label>
            <input type="radio" name="Gender" value="Male"> Male
            <input type="radio" name="Gender" value="Female"> Female
            <input type="radio" name="Gender" value="Other"> Other
            <br>
            <label> Password </label>
            <input type="password" name="Pass">
            <br>
            <label> choose Country </label><br>
            <select>
                <option> Nepal </option>
                <option> India </option>
                <option> China </option>    
            </select>
             <br>
            <label> Choose your interest </label>
            <input type="checkbox" name="playing"> Playing
            <input type="checkbox" name="reading"> Reading  
            <input type="checkbox" name="travelling"> Travelling
            <br>
            <input type="hidden" name="hidden" value="hidden">
            <input type="submit" name="submit" value="Submit">
            <br>
            <label> Message </label>
            <textarea></textarea>
            <input type="submit">
            </fieldset>
        </form>
