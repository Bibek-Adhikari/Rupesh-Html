<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RupeshDev">
    <meta name="description" content="Personal portfolio of Rupesh Adhikari, aspiring web developer">
    <title>Contact - Rupesh Adhikari</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header>
        <h1>Contact Me</h1>
        <p>I'd love to hear from you</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="interest.html">Interest</a></li>
            <li><a href="contact.html" class="active">Contact Me</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="frindlist.html">Friend List</a></li>
        </ul>
    </nav>

    <main id="main-content">
        <section>
            <h2>Get in Touch</h2>
            <div class="card">
                <form>
                    <fieldset>
                        <legend>Your Details</legend>

                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="Full name" placeholder="Enter your full name">
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="number" id="phone" name="Phone" maxlength="10" placeholder="Enter phone number">
                        </div>

                        <label>Gender</label>
                        <div class="form-row">
                            <input type="radio" name="Gender" value="Male" id="male">
                            <label for="male" style="display:inline; margin-bottom:0;">Male</label>
                            <input type="radio" name="Gender" value="Female" id="female">
                            <label for="female" style="display:inline; margin-bottom:0;">Female</label>
                            <input type="radio" name="Gender" value="Other" id="other">
                            <label for="other" style="display:inline; margin-bottom:0;">Other</label>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="Pass" placeholder="Enter password">
                        </div>

                        <div class="form-group">
                            <label for="country">Choose Country</label>
                            <select id="country">
                                <option>Nepal</option>
                                <option>India</option>
                                <option>China</option>
                            </select>
                        </div>

                        <label>Choose your interest</label>
                        <div class="form-row">
                            <input type="checkbox" name="playing" id="playing">
                            <label for="playing" style="display:inline; margin-bottom:0;">Playing</label>
                            <input type="checkbox" name="reading" id="reading">
                            <label for="reading" style="display:inline; margin-bottom:0;">Reading</label>
                            <input type="checkbox" name="travelling" id="travelling">
                            <label for="travelling" style="display:inline; margin-bottom:0;">Travelling</label>
                        </div>

                        <input type="hidden" name="hidden" value="hidden">

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" placeholder="Write your message here..."></textarea>
                        </div>

                        <input type="submit" name="submit" value="Submit">
                    </fieldset>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" title="LinkedIn" aria-label="LinkedIn">in</a>
            <a href="#" title="GitHub" aria-label="GitHub">gh</a>
            <a href="#" title="YouTube" aria-label="YouTube">yt</a>
        </div>
        <p>Rupesh Adhikari &mdash; Always happy to connect</p>
    </footer>

    <a href="#top" class="scroll-top" id="scrollTop" title="Back to top" aria-label="Back to top">&#8593;</a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                console.log('Service Worker registered:', reg.scope);
            }).catch(function(err) {
                console.log('Service Worker registration failed:', err);
            });
        }
        var scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
