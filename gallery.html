<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RupeshDev">
    <meta name="description" content="Personal portfolio of Rupesh Adhikari, aspiring web developer">
    <title>Gallery - Rupesh Adhikari</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header>
        <h1>My Gallery</h1>
        <p>Moments captured in media</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="interest.html">Interest</a></li>
            <li><a href="contact.html">Contact Me</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="frindlist.html">Friend List</a></li>
        </ul>
    </nav>

    <main id="main-content">
        <section>
            <h2>Gallery</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <a href="bcanepal.jpg">
                        <img src="bcanepal.jpg" alt="BCA Nepal">
                    </a>
                    <div class="caption">BCA Nepal</div>
                </div>

                <div class="gallery-item">
                    <video controls>
                        <source src="video/vid.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="caption">Featured Video</div>
                </div>

                <div class="gallery-item">
                    <audio controls>
                        <source src="audio/geet.mp3" type="audio/mp3">
                        Your browser does not support the audio tag.
                    </audio>
                    <div class="caption">Featured Audio</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" title="LinkedIn" aria-label="LinkedIn">in</a>
            <a href="#" title="GitHub" aria-label="GitHub">gh</a>
            <a href="#" title="YouTube" aria-label="YouTube">yt</a>
        </div>
        <p>Rupesh Adhikari &mdash; Gallery</p>
    </footer>

    <a href="#top" class="scroll-top" id="scrollTop" title="Back to top" aria-label="Back to top">&#8593;</a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                console.log('Service Worker registered:', reg.scope);
            }).catch(function(err) {
                console.log('Service Worker registration failed:', err);
            });
        }
        var scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
